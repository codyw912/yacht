[metadata]
author = "yacht"
description = "Advisory-judge example: Jev scores the agent's output where a deterministic verifier cannot decide."
difficulty = "easy"

[verifier]
timeout_sec = 120.0
# Judge config reaches tests/test.sh via [verifier] env as JUDGE_* vars — the
# only channel that reaches the verifier (required_secrets is agent-only, and
# task.toml is a sensitive file not mounted into the container). The API key
# must be set explicitly here; required_secrets does NOT reach the verifier.
# NOTE: verify_between = true ignores [verifier] env, so Jev judging is
# incompatible with verify_between unless the key is delivered another way.
[verifier.env]
TYPESAFE_API_KEY = "${TYPESAFE_API_KEY}"
JUDGE_BACKEND = "typesafe"
JUDGE_BASE_URL = "https://api.typesafe.ai/v1/systemone"
JUDGE_MODEL = "jev-latest"
JUDGE_API_KEY_ENV = "TYPESAFE_API_KEY"
JUDGE_CONFIDENCE_THRESHOLD = "0.5"
JUDGE_ON_LOW_CONFIDENCE = "human-review"   # llm-judge | human-review | advisory-only
JUDGE_REQUEST_TIMEOUT_SEC = "20"
JUDGE_ON_ERROR = "unresolved"              # unresolved | zero | advisory-only

[agent]
timeout_sec = 300.0
