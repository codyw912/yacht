# Compare two pinned Claude Code versions on one Aider Polyglot exercise.
#
# Aider Polyglot runs on the Harbor course foundation (ADR 0012): the same
# launcher image, yacht-owned agents, and rollout pipeline as the
# Terminal-Bench course, pointed at a different pinned registry dataset.
#
# Requirements: Docker running, uv, ANTHROPIC_API_KEY exported, and the
# launcher image built:
#
#   docker build -t yacht/harbor-launcher:harbor-0.20.0 containers/harbor-launcher
#
# Run with:
#
#   uv run yacht run examples/aider-polyglot-claude-code-versions-smoke.toml \
#     --logbook /private/tmp/yacht-aider-polyglot-smoke \
#     --workspace . \
#     --secret anthropic=@env:ANTHROPIC_API_KEY

[regatta]
name = "aider-polyglot-claude-code-versions-smoke"

[preflight]
failure_policy = "abort-group"

[course]
name = "aider-polyglot"

[[course.tasks]]
id = "polyglot_python_wordy"
title = "Complete the wordy exercise in Python"

[course.adapter]
kind = "aider-polyglot"
dataset = "aider-polyglot"
split = "1.0"
harness = "harbor"

[secrets.anthropic]
source = "env"
name = "ANTHROPIC_API_KEY"

[runtimes.harbor-claude-211]
backend = "harbor"
image = "yacht/harbor-launcher:harbor-0.20.0"
harness = "claude-code"
harness_version = "2.1.211"
required_secrets = ["anthropic"]

[runtimes.harbor-claude-211.preflight]
required = true
checks = [
  { name = "docker-daemon", kind = "command", command = ["docker", "info"] },
  { name = "harbor-launcher-image", kind = "command", command = ["docker", "image", "inspect", "yacht/harbor-launcher:harbor-0.20.0"] },
  { name = "agent-install", kind = "install-only" },
]

[runtimes.harbor-claude-215]
backend = "harbor"
image = "yacht/harbor-launcher:harbor-0.20.0"
harness = "claude-code"
harness_version = "2.1.215"
required_secrets = ["anthropic"]

[runtimes.harbor-claude-215.preflight]
required = true
checks = [
  { name = "docker-daemon", kind = "command", command = ["docker", "info"] },
  { name = "harbor-launcher-image", kind = "command", command = ["docker", "image", "inspect", "yacht/harbor-launcher:harbor-0.20.0"] },
  { name = "agent-install", kind = "install-only" },
]

[[vessels]]
name = "claude-code-2-1-211"
model = "anthropic/claude-haiku-4-5"
runtime = "harbor-claude-211"

[[vessels]]
name = "claude-code-2-1-215"
model = "anthropic/claude-haiku-4-5"
runtime = "harbor-claude-215"

[[comparisons]]
name = "claude-code-211-vs-215-polyglot"
course = "aider-polyglot"
vessels = ["claude-code-2-1-211", "claude-code-2-1-215"]
