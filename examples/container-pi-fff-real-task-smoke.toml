[regatta]
name = "container-pi-fff-real-task-smoke"

[preflight]
failure_policy = "abort-group"

[course]
name = "container-pi-fff-real-task-smoke"
tasks = [
  { id = "container-pi-fff-smoke-1", title = "Inspect this repository using any configured runtime tooling available to you, then reply with a compact JSON object containing completed and tool_calls.", difficulty = 1 },
]

[secrets.anthropic]
source = "env"
name = "ANTHROPIC_API_KEY"

[runtimes.pi-container]
backend = "container"
agent = "pi"
image = "yacht/pi-agent-runtime:pi-0.74.0"
command = ["pi", "--provider", "anthropic", "--model", "haiku", "--print", "--mode", "json"]
container_home = "/home/yacht"
container_workspace = "/workspace"
required_secrets = ["anthropic"]

[runtimes.pi-container.preflight]
required = true
checks = [
  { name = "pi-present", kind = "command", command = ["pi", "--version"] },
  { name = "runtime-home-isolated", kind = "path-isolation", env = ["HOME", "XDG_CONFIG_HOME", "XDG_CACHE_HOME", "XDG_STATE_HOME"] },
]

[riggings.pi-fff]
tools = ["fff"]
install = ["npm:@ff-labs/pi-fff"]
instructions = "Use fff for codebase memory and navigation. For this smoke task, make exactly one minimal fffind tool call before answering."

[riggings.pi-fff.env]
PI_FFF_MODE = "required"
FFF_FRECENCY_DB = "{trial_state}/fff-frecency.sqlite"
FFF_HISTORY_DB = "{trial_state}/fff-history.sqlite"

[riggings.pi-fff.preflight]
required = true
checks = [
  { name = "fff-mode", kind = "env", env = ["PI_FFF_MODE"] },
  { name = "fff-state-isolated", kind = "path-isolation", env = ["FFF_FRECENCY_DB", "FFF_HISTORY_DB"] },
  { name = "fff-headless-smoke", kind = "agent-prompt", prompt = "preflights/pi-fff.md", expect_tool_calls = ["fffind"] },
]

[[vessels]]
name = "pi-container-baseline"
model = "haiku"
runtime = "pi-container"

[[vessels]]
name = "pi-container-fff"
model = "haiku"
runtime = "pi-container"
rigging = ["pi-fff"]

[[comparisons]]
name = "container-pi-vs-pi-fff-real-task"
course = "container-pi-fff-real-task-smoke"
vessels = ["pi-container-baseline", "pi-container-fff"]
