# Provider-neutral SecretSpec manifest for Yacht contributors.
#
# This file declares WHICH secrets Yacht's evaluated harnesses need. It
# never says where yours live: keep provider aliases, vault names, item
# names, and field names in an uncommitted `secretspec.local.toml` that
# extends this file (see docs/reference/secrets.md).
#
# Nothing here is loaded into `devenv shell`. Secrets are supplied around
# individual Yacht commands only — `yacht-run-anthropic`,
# `yacht-run-openai`, or an explicit `secretspec run --scope ...`.
#
# SecretSpec is optional: Yacht's `--secret NAME=@env:VARIABLE` accepts a
# variable from any supplier.

[project]
name = "yacht"
revision = "1.0"

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic API key for Claude Code and Pi Yacht trials" }
OPENAI_API_KEY = { description = "OpenAI API key for OMP and Codex Yacht trials" }

# Scopes keep one live run down to one key. `secretspec run --scope
# anthropic` resolves ANTHROPIC_API_KEY and removes every other declared
# secret from the child environment, even one the parent already exported.
[scopes.anthropic]
secrets = ["ANTHROPIC_API_KEY"]

[scopes.openai]
secrets = ["OPENAI_API_KEY"]
