name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Run tests
        run: uv run --locked -m unittest discover -s tests

      - name: Compile package
        run: uv run --locked -m compileall src tests

      - name: Verify sample regatta
        run: uv run --locked yacht run examples/memory-smoke-test.toml --logbook /tmp/yacht-logbook-ci
